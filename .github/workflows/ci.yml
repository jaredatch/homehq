name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
        env:
          # The build only needs the shape of the files, not real values.
          COOKIE_SECRET: ci-placeholder
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
